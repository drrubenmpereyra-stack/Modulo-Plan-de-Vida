<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes - Clínica de la Convergencia</title>
    
    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-cian: #083344;
            --cian-card: #0f4c5c;
            --cian-light: #e0f2fe;
            --bordo: #881337;
            --bordo-hover: #4c0519;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h2 {
            color: #0e7490;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-size: 20px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 10px;
        }

        /* Tarjeta de Formulario */
        .form-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 35px;
            border: 1px solid #e2e8f0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            color: #334155;
        }

        .form-group input {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--bordo);
            box-shadow: 0 0 0 3px rgba(136, 19, 55, 0.15);
        }

        /* Botones Bordó Alto Contraste */
        .btn-action {
            background-color: var(--bordo);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(136, 19, 55, 0.3);
        }

        .btn-action:hover {
            background-color: var(--bordo-hover);
            transform: translateY(-1px);
        }

        .btn-secundario {
            background-color: #64748b;
            margin-left: 10px;
        }
        .btn-secundario:hover {
            background-color: #475569;
        }

        /* Tabla de Pacientes */
        .table-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #0e7490;
            color: white;
            padding: 14px 16px;
            font-weight: 600;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .patient-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bordo);
        }

        .btn-table {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }

        .btn-edit {
            background-color: #0e7490;
            color: white;
            margin-right: 5px;
        }
        .btn-edit:hover { background-color: #0b5ed7; }

        .btn-delete {
            background-color: #ef4444;
            color: white;
        }
        .btn-delete:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro y Gestión de Pacientes</h2>

        <!-- Formulario de Registro / Edición -->
        <div class="form-card">
            <form id="patientForm" onsubmit="guardarPaciente(event)">
                <input type="hidden" id="patientId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre">Apellido y Nombres:</label>
                        <input type="text" id="nombre" required placeholder="Ej. Pérez, María">
                    </div>
                    <div class="form-group">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" required placeholder="Número de documento">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" required placeholder="Celular de contacto">
                    </div>
                    <div class="form-group">
                        <label for="foto">Foto (nombre de archivo.jpg):</label>
                        <input type="text" id="foto" required placeholder="ej. mariaperez.jpg">
                    </div>
                    <div class="form-group">
                        <label for="codigo">Código Interno:</label>
                        <input type="text" id="codigo" required placeholder="Ej. CC-501">
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <button type="submit" class="btn-action" id="btnGuardar">Guardar Paciente</button>
                    <button type="button" class="btn-action btn-secundario" id="btnCancelar" style="display:none;" onclick="limpiarFormulario()">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <!-- Listado de Pacientes Registrados -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Código</th>
                        <th>Apellido y Nombres</th>
                        <th>DNI</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="patientsTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted);">Cargando pacientes...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de Gestión conectado a Firestore -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD_ru-VW32S77NlTJgpV7gHBrSDBEUNZPs",
          authDomain: "plan-de-vida-be189.firebaseapp.com",
          projectId: "plan-de-vida-be189",
          storageBucket: "plan-de-vida-be189.firebasestorage.app",
          messagingSenderId: "970544287065",
          appId: "1:970544287065:web:cde28f9a2260f636e95048"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const collectionName = "pacientes";

        // Cargar y mostrar pacientes en tiempo real
        document.addEventListener('DOMContentLoaded', () => {
            obtenerPacientes();
        });

        function obtenerPacientes() {
            db.collection(collectionName).onSnapshot((snapshot) => {
                const tbody = document.getElementById('patientsTableBody');
                tbody.innerHTML = '';

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b;">No hay pacientes registrados todavía.</td></tr>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const p = doc.data();
                    const id = doc.id;
                    
                    // Avatar predeterminado seguro en SVG integrado
                    const defaultAvatar = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="%23881337" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';
                    const fotoSrc = p.foto ? p.foto : defaultAvatar;

                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${fotoSrc}" alt="Foto" class="patient-avatar" onerror="this.src='${defaultAvatar}'"></td>
                            <td><strong>${p.codigo || ''}</strong></td>
                            <td>${p.nombre || ''}</td>
                            <td>${p.dni || ''}</td>
                            <td>${p.telefono || ''}</td>
                            <td>
                                <button class="btn-table btn-edit" onclick="prepararEdicion('${id}', '${p.nombre}', '${p.dni}', '${p.telefono}', '${p.foto}', '${p.codigo}')">Editar</button>
                                <button class="btn-table btn-delete" onclick="eliminarPaciente('${id}')">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        // Guardar o Actualizar Paciente
        async function guardarPaciente(e) {
            e.preventDefault();
            const id = document.getElementById('patientId').value;
            const data = {
                nombre: document.getElementById('nombre').value.trim(),
                dni: document.getElementById('dni').value.trim(),
                telefono: document.getElementById('telefono').value.trim(),
                foto: document.getElementById('foto').value.trim(),
                codigo: document.getElementById('codigo').value.trim(),
                actualizado: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (id) {
                    // Actualizar registro existente
                    await db.collection(collectionName).doc(id).update(data);
                    alert('Paciente actualizado correctamente.');
                } else {
                    // Crear nuevo registro
                    await db.collection(collectionName).add(data);
                    alert('Paciente registrado exitosamente.');
                }
                limpiarFormulario();
            } catch (error) {
                console.error("Error al guardar paciente: ", error);
                alert("Hubo un error al guardar los datos.");
            }
        }

        // Cargar datos en el formulario para edición
        function prepararEdicion(id, nombre, dni, telefono, foto, codigo) {
            document.getElementById('patientId').value = id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('dni').value = dni;
            document.getElementById('telefono').value = telefono;
            document.getElementById('foto').value = foto;
            document.getElementById('codigo').value = codigo;

            document.getElementById('btnGuardar').innerText = "Actualizar Datos";
            document.getElementById('btnCancelar').style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Eliminar registro en forma definitiva
        async function eliminarPaciente(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este paciente en forma definitiva?")) {
                try {
                    await db.collection(collectionName).doc(id).delete();
                    alert("Paciente eliminado correctamente.");
                } catch (error) {
                    console.error("Error al eliminar: ", error);
                    alert("No se pudo eliminar el registro.");
                }
            }
        }

        function limpiarFormulario() {
            document.getElementById('patientForm').reset();
            document.getElementById('patientId').value = '';
            document.getElementById('btnGuardar').innerText = "Guardar Paciente";
            document.getElementById('btnCancelar').style.display = "none";
        }
    </script>
</body>
</html>
