<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de la Convergencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cian: #083344;
            --cian-card: #0f4c5c;
            --cian-light: #e0f2fe;
            --bordo: #881337;
            --bordo-hover: #4c0519;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #042f2e 0%, var(--bg-cian) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Estilos generales de la interfaz principal */
        #login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background: rgba(4, 47, 46, 0.95);
        }

        .login-card {
            background: rgba(15, 76, 92, 0.9);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(224, 242, 254, 0.15);
            width: 350px;
            text-align: center;
        }

        .login-card h2 {
            color: #ffffff;
            margin-top: 0;
            font-size: 1.4rem;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(224, 242, 254, 0.2);
            padding-bottom: 10px;
        }

        .login-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            margin-bottom: 15px;
        }

        .login-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--cian-light);
        }

        .login-group input {
            padding: 10px 12px;
            background: rgba(8, 51, 68, 0.8);
            border: 1px solid rgba(224, 242, 254, 0.2);
            border-radius: 8px;
            font-size: 0.95rem;
            color: #fff;
            outline: none;
        }

        .login-group input:focus {
            border-color: var(--bordo);
            box-shadow: 0 0 0 3px rgba(136, 19, 55, 0.4);
        }

        .login-btn {
            background-color: var(--bordo);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(136, 19, 55, 0.4);
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-color: var(--bordo-hover);
        }

        #app-section {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Encabezado y Navegación */
        .app-header {
            background: rgba(15, 76, 92, 0.95);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(224, 242, 254, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title span {
            font-size: 0.85rem;
            color: var(--cian-light);
            font-weight: normal;
        }

        .nav-container {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Estilos de Botones y Menús Desplegables */
        .nav-btn, .dropdown-toggle {
            background-color: var(--bordo);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(136, 19, 55, 0.3);
            transition: all 0.2s ease;
        }

        .nav-btn:hover, .dropdown-toggle:hover {
            background-color: var(--bordo-hover);
        }

        .nav-item {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            left: 0;
            background-color: var(--cian-card);
            min-width: 200px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            z-index: 1000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(224, 242, 254, 0.2);
            margin-top: 4px;
        }

        .dropdown-menu button {
            color: var(--text-main);
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .dropdown-menu button:hover {
            background-color: rgba(136, 19, 55, 0.5);
        }

        .nav-item:hover .dropdown-menu {
            display: block;
        }

        .logout-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background-color: #1e293b;
        }

        .content-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: rgba(8, 51, 68, 0.4);
        }
    </style>

    <!-- SDKs de Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- Sección de Login -->
    <div id="login-section">
        <div class="login-card">
            <h2>Iniciar Sesión</h2>
            <div class="login-group">
                <label>Usuario / Apellido</label>
                <input type="text" id="usuario">
            </div>
            <div class="login-group">
                <label>Código Interno / Contraseña</label>
                <input type="password" id="password">
            </div>
            <button class="login-btn" onclick="intentarLogin()">Ingresar</button>
            <p id="error-msg" style="color: #fca5a5; font-size: 0.85rem; margin-top: 12px; display: none;"></p>
        </div>
    </div>

    <!-- Sección de la Aplicación -->
    <div id="app-section">
        <header class="app-header">
            <div class="header-title">
                <i class="fa-solid fa-brain" style="color: #22d3ee;"></i> Clínica de la Convergencia &nbsp;|&nbsp; <span id="displayUser"></span>
            </div>
            <nav id="dynamicNav" class="nav-container">
                <!-- El menú se inyecta dinámicamente según el rol -->
            </nav>
            <button class="logout-btn" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
        </header>

        <iframe id="mainFrame" name="mainFrame" class="content-frame"></iframe>
    </div>

    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyD_ru-VW32S77NlTJgpV7gHBrSDBEUNZPs",
          authDomain: "plan-de-vida-be189.firebaseapp.com",
          projectId: "plan-de-vida-be189",
          storageBucket: "plan-de-vida-be189.firebasestorage.app",
          messagingSenderId: "970544287065",
          appId: "1:970544287065:web:cde28f9a2260f636e95048"
        };

        // Initialize Firebase (compatible con CDN global)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Referencias a elementos de la vista
        const loginSection = document.getElementById('login-section');
        const appSection = document.getElementById('app-section');

        // Comprobar estado de sesión al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            const currentRole = sessionStorage.getItem('userRole');
            const currentUserName = sessionStorage.getItem('userName');

            if (currentRole && currentUserName) {
                mostrarApp(currentRole, currentUserName);
            } else {
                mostrarLogin();
            }
        });

        // Función de Login dinámica y estricta
        window.intentarLogin = async function() {
            const userInput = document.getElementById('usuario').value.trim();
            const passInput = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';

            if (!userInput || !passInput) {
                errorMsg.innerText = "Por favor, complete ambos campos.";
                errorMsg.style.display = 'block';
                return;
            }

            // 1. Verificación de Administrador Fijo
            if (userInput.toUpperCase() === "DRPEREYRA" && passInput === "235689") {
                sessionStorage.setItem('userName', 'Dr. Pereyra');
                sessionStorage.setItem('userRole', 'admin');
                mostrarApp('admin', 'Dr. Pereyra');
                return;
            }

            // 2. Verificación de Paciente en Base de Datos (Firestore)
            // El usuario ingresa su Apellido y la contraseña es su Código Interno
            try {
                const querySnapshot = await db.collection("pacientes")
                    .where("codigo", "==", passInput)
                    .get();

                if (querySnapshot.empty) {
                    errorMsg.innerText = "Usuario o código interno incorrectos.";
                    errorMsg.style.display = 'block';
                    return;
                }

                let pacienteEncontrado = false;
                let nombrePaciente = "";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    // Verificamos si el apellido ingresado coincide (ignorando mayúsculas/minúsculas parciales)
                    const nombreRegistrado = data.nombre ? data.nombre.toLowerCase() : "";
                    const apellidoIngresado = userInput.toLowerCase();

                    if (nombreRegistrado.includes(apellidoIngresado)) {
                        pacienteEncontrado = true;
                        nombrePaciente = data.nombre;
                    }
                });

                if (pacienteEncontrado) {
                    sessionStorage.setItem('userName', nombrePaciente);
                    sessionStorage.setItem('userRole', 'patient');
                    sessionStorage.setItem('patientCode', passInput);
                    mostrarApp('patient', nombrePaciente);
                } else {
                    errorMsg.innerText = "El apellido no coincide con el código ingresado.";
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                console.error("Error al validar el acceso:", error);
                errorMsg.innerText = "Error de conexión con la base de datos.";
                errorMsg.style.display = 'block';
            }
        }

        function mostrarLogin() {
            loginSection.style.display = 'flex';
            appSection.style.display = 'none';
        }

        function mostrarApp(role, userName) {
            loginSection.style.display = 'none';
            appSection.style.display = 'flex';
            document.getElementById('displayUser').innerText = `${userName} (${role === 'admin' ? 'ADMINISTRADOR' : 'PACIENTE'})`;
            construirMenuNavegacion(role);
        }

        function construirMenuNavegacion(role) {
            const navContainer = document.getElementById('dynamicNav');
            if (!navContainer) return;

            let menuHTML = '';

            if (role === 'admin') {
                menuHTML = `
                    <button class="nav-btn" onclick="cargarVista('pacientes.html')">Pacientes</button>
                    <div class="nav-item">
                        <button class="dropdown-toggle">Protocolo ▾</button>
                        <div class="dropdown-menu">
                            <button onclick="cargarVista('exp_autor.html')">Autorrealización</button>
                            <button onclick="cargarVista('exp_ma.html')">Mapa de autenticidad</button>
                            <button onclick="cargarVista('exp_urg_sentido.html')">Urgencia y sentido</button>
                            <button onclick="cargarVista('exp_vys.html')">Viabilidad y sostén</button>
                            <button onclick="cargarVista('exp_val_freno.html')">Valoración y freno</button>
                            <button onclick="cargarVista('exp_explvital.html')">Exploración Vital</button>
                        </div>
                    </div>
                    <button class="nav-btn" onclick="cargarVista('integracion.html')">Integración y conclusiones</button>
                    <button class="nav-btn" onclick="cargarVista('habilitacion.html')">Habilitación Paciente</button>
                `;
            } else if (role === 'patient') {
                menuHTML = `
                    <div class="nav-item">
                        <button class="dropdown-toggle">Protocolo ▾</button>
                        <div class="dropdown-menu">
                            <button onclick="cargarVista('autorrealizacion.html')">Autorrealización</button>
                            <button onclick="cargarVista('mapaautenticidad.html')">Mapa de autenticidad</button>
                            <button onclick="cargarVista('urgenciaysentido.html')">Urgencia y sentido</button>
                            <button onclick="cargarVista('viaysosten.html')">Viabilidad y sostén</button>
                            <button onclick="cargarVista('valoracionyfreno.html')">Valoración y freno</button>
                            <button onclick="cargarVista('explvital.html')">Exploración Vital</button>
                        </div>
                    </div>
                    <button class="nav-btn" onclick="cargarVista('resultados.html')">Resultados</button>
                    <div class="nav-item">
                        <button class="dropdown-toggle">Plan ▾</button>
                        <div class="dropdown-menu">
                            <button onclick="cargarVista('objetivos.html')">Objetivos</button>
                            <button onclick="cargarVista('metas.html')">Metas</button>
                            <button onclick="cargarVista('recursos.html')">Recursos</button>
                            <button onclick="cargarVista('tiempos.html')">Tiempos</button>
                            <button onclick="cargarVista('plan_esquema.html')">Plan Gráfico</button>
                        </div>
                    </div>
                `;
            }
            navContainer.innerHTML = menuHTML;
        }

        // Funciones globales accesibles desde la interfaz
        window.cargarVista = function(urlPagina) {
            const iframe = document.getElementById('mainFrame');
            if (iframe) {
                iframe.src = urlPagina;
            }
        }

        window.cerrarSesion = function() {
            sessionStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
