<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de la Convergencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos generales del sistema */
        :root {
            --bg-cian: #083344;
            --cian-card: #0f4c5c;
            --bordo: #881337;
            --bordo-hover: #4c0519;
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #042f2e 0%, var(--bg-cian) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Estilos del menú y dropdowns basados en tu estructura previa */
        .nav-item {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: var(--cian-card);
            min-width: 200px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            z-index: 100;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(224, 242, 254, 0.2);
        }

        .dropdown-menu button {
            color: var(--text-main);
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .dropdown-menu button:hover {
            background-color: rgba(136, 19, 55, 0.5);
        }

        .nav-item:hover .dropdown-menu {
            display: block;
        }

        /* Contenedor principal y login */
        #login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #app-section {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .content-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: rgba(8, 51, 68, 0.4);
        }
    </style>

    <!-- SDKs de Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- Sección de Login -->
    <div id="login-section">
        <div style="background: rgba(15, 76, 92, 0.85); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; text-align: center;">
            <h2>Iniciar Sesión</h2>
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="font-size: 0.85rem;">Usuario / Apellido</label>
                <input type="text" id="usuario" style="width: 100%; padding: 10px; margin-top: 5px; background: rgba(8, 51, 68, 0.6); border: 1px solid rgba(224, 242, 254, 0.2); color: #fff; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px; text-align: left;">
                <label style="font-size: 0.85rem;">Código Interno / Contraseña</label>
                <input type="password" id="password" style="width: 100%; padding: 10px; margin-top: 5px; background: rgba(8, 51, 68, 0.6); border: 1px solid rgba(224, 242, 254, 0.2); color: #fff; border-radius: 6px; box-sizing: border-box;">
            </div>
            <button onclick="intentarLogin()" style="width: 100%; padding: 10px; background: var(--bordo); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Ingresar</button>
            <p id="error-msg" style="color: #ff6b6b; font-size: 0.85rem; margin-top: 10px; display: none;"></p>
        </div>
    </div>

    <!-- Sección de la Aplicación -->
    <div id="app-section">
        <header style="background: rgba(15, 76, 92, 0.95); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(224, 242, 254, 0.2);">
            <div style="font-weight: bold; font-size: 1.1rem; color: #fff;">
                Clínica de la Convergencia - <span id="displayUser" style="font-size: 0.9rem; color: #cbd5e1;"></span>
            </div>
            <nav id="dynamicNav" style="display: flex; gap: 10px; align-items: center;">
                <!-- El menú se inyecta dinámicamente según el rol -->
            </nav>
            <button onclick="cerrarSesion()" style="background: var(--bordo); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">Cerrar Sesión</button>
        </header>

        <iframe id="mainFrame" name="mainFrame" class="content-frame"></iframe>
    </div>

    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD_ru-VW32S77NlTJgpV7gHBrSDBEUNZPs",
            authDomain: "plan-de-vida-be189.firebaseapp.com",
            projectId: "plan-de-vida-be189",
            storageBucket: "plan-de-vida-be189.firebasestorage.app",
            messagingSenderId: "970544287065",
            appId: "1:970544287065:web:cde28f9a2260f636e95048"
        };

        // Initialize Firebase (compatible con CDN global)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Referencias a elementos de la vista
        const loginSection = document.getElementById('login-section');
        const appSection = document.getElementById('app-section');

        // Comprobar estado de sesión al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            const currentRole = sessionStorage.getItem('userRole');
            const currentUserName = sessionStorage.getItem('userName');

            if (currentRole && currentUserName) {
                mostrarApp(currentRole, currentUserName);
            } else {
                mostrarLogin();
            }
        });

        // Función de Login dinámica y estricta
        window.intentarLogin = async function() {
            const userInput = document.getElementById('usuario').value.trim();
            const passInput = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';

            if (!userInput || !passInput) {
                errorMsg.innerText = "Por favor, complete ambos campos.";
                errorMsg.style.display = 'block';
                return;
            }

            // 1. Verificación de Administrador Fijo
            if (userInput.toUpperCase() === "DRPEREYRA" && passInput === "235689") {
                sessionStorage.setItem('userName', 'Dr. Pereyra');
                sessionStorage.setItem('userRole', 'admin');
                mostrarApp('admin', 'Dr. Pereyra');
                return;
            }

            // 2. Verificación de Paciente en Base de Datos (Firestore)
            try {
                const querySnapshot = await db.collection("pacientes")
                    .where("codigo", "==", passInput)
                    .get();

                if (querySnapshot.empty) {
                    errorMsg.innerText = "Usuario o código interno incorrectos.";
                    errorMsg.style.display = 'block';
                    return;
                }

                let pacienteEncontrado = false;
                let nombrePaciente = "";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const nombreRegistrado = data.nombre ? data.nombre.toLowerCase() : "";
                    const apellidoIngresado = userInput.toLowerCase();

                    if (nombreRegistrado.includes(apellidoIngresado)) {
                        pacienteEncontrado = true;
                        nombrePaciente = data.nombre;
                    }
                });

                if (pacienteEncontrado) {
                    sessionStorage.setItem('userName', nombrePaciente);
                    sessionStorage.setItem('userRole', 'patient');
                    sessionStorage.setItem('patientCode', passInput);
                    mostrarApp('patient', nombrePaciente);
                } else {
                    errorMsg.innerText = "El apellido no coincide con el código ingresado.";
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                console.error("Error al validar el acceso:", error);
                errorMsg.innerText = "Error de conexión con la base de datos.";
                errorMsg.style.display = 'block';
            }
        }

        function mostrarLogin() {
            loginSection.style.display = 'flex';
            appSection.style.display = 'none';
        }

        function mostrarApp(role, userName) {
            loginSection.style.display = 'none';
            appSection.style.display = 'flex';
            document.getElementById('displayUser').innerText = `${userName} (${role === 'admin' ? 'ADMINISTRADOR' : 'PACIENTE'})`;
            construirMenuNavegacion(role);
        }

        function construirMenuNavegacion(role) {
            const navContainer = document.getElementById('dynamicNav');
            if (!navContainer) return;

            let menuHTML = '';

            if (role === 'admin') {
                menuHTML = `
                    <button class="nav-btn" onclick="cargarVista('pacientes.html')" style="background: var(--bordo); color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Pacientes</button>
                    <div class="nav-item">
                        <button class="dropdown-toggle" style="background: var(--bordo); color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Protocolo ▾</button>
                        <div class="dropdown-menu">
                            <button onclick="cargarVista('exp_autor.html')">Autorrealización</button>
                            <button onclick="cargarVista('exp_ma.html')">Mapa de autenticidad</button>
                            <button onclick="cargarVista('exp_urg_sentido.html')">Urgencia y sentido</button>
                            <button onclick="cargarVista('exp_vys.html')">Viabilidad y sostén</button>
                            <button onclick="cargarVista('exp_val_freno.html')">Valoración y freno</button>
                            <button onclick="cargarVista('exp_explvital.html')">Exploración Vital</button>
                        </div>
                    </div>
                    <button class="nav-btn" onclick="cargarVista('integracion.html')" style="background: var(--bordo); color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Integración y conclusiones</button>
                    <button class="nav-btn" onclick="cargarVista('habilitacion.html')" style="background: #334155; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Habilitación Paciente</button>
                `;
            } else if (role === 'patient') {
                menuHTML = `
                    <div class="nav-item">
                        <button class="dropdown-toggle" style="background: var(--bordo); color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Protocolo ▾</button>
                        <div class="dropdown-menu">
                            <button onclick="cargarVista('autorrealizacion.html')">Autorrealización</button>
                            <button onclick="cargarVista('mapaautenticidad.html')">Mapa de autenticidad</button>
                            <button onclick="cargarVista('urgenciaysentido.html')">Urgencia y sentido</button>
                            <button onclick="cargarVista('viaysosten.html')">Viabilidad y sostén</button>
                            <button onclick="cargarVista('valoracionyfreno.html')">Valoración y freno</button>
                            <button onclick="cargarVista('explvital.html')">Exploración Vital</button>
                        </div>
                    </div>
                    <button class="nav-btn" onclick="cargarVista('resultados.html')" style="background: #0e7490; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Resultados</button>
                    <div class="nav-item">
                        <button class="dropdown-toggle" style="background: var(--bordo); color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Plan ▾</button>
                        <div class="dropdown-menu">
                            <button onclick="cargarVista('objetivos.html')">Objetivos</button>
                            <button onclick="cargarVista('metas.html')">Metas</button>
                            <button onclick="cargarVista('recursos.html')">Recursos</button>
                            <button onclick="cargarVista('tiempos.html')">Tiempos</button>
                            <button onclick="cargarVista('plan_esquema.html')">Plan Gráfico</button>
                        </div>
                    </div>
                `;
            }
            navContainer.innerHTML = menuHTML;
        }

        // Funciones globales accesibles desde la interfaz
        window.cargarVista = function(urlPagina) {
            const iframe = document.getElementById('mainFrame');
            if (iframe) {
                iframe.src = urlPagina;
            }
        }

        window.cerrarSesion = function() {
            sessionStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
