<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de la Convergencia - Panel Principal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-cian: #083344;
            --cian-card: #0f4c5c;
            --cian-light: #e0f2fe;
            --bordo: #881337;
            --bordo-hover: #4c0519;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #042f2e 0%, var(--bg-cian) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Encabezado General / Menú Global */
        .app-header {
            background: rgba(15, 76, 92, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(224, 242, 254, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 15px;
            z-index: 1000;
        }

        .logo-area {
            color: #ffffff;
            font-weight: bold;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-menu {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--bordo);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(136, 19, 55, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn:hover {
            background-color: var(--bordo-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(136, 19, 55, 0.6);
        }

        .btn-secundario { background-color: #0e7490; }
        .btn-secundario:hover { background-color: #155e75; }

        .btn-admin { background-color: #334155; }
        .btn-admin:hover { background-color: #1e293b; }

        /* Estilos para el menú desplegable (Solapa de Plan) */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: var(--cian-card);
            min-width: 180px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            z-index: 1100;
            border-radius: 8px;
            border: 1px solid rgba(224, 242, 254, 0.2);
            overflow: hidden;
            margin-top: 5px;
        }
        .dropdown-content a {
            color: var(--text-main);
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .dropdown-content a:hover {
            background-color: rgba(136, 19, 55, 0.5);
        }

        /* Contenedor del Iframed / Vista de Contenido */
        .content-container {
            flex: 1;
            width: 100%;
            border: none;
            background: rgba(8, 51, 68, 0.4);
        }
    </style>
</head>
<body>

    <!-- Encabezado Unificado con el Menú Global Solicitado -->
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-brain" style="color: #22d3ee;"></i> Clínica de la Convergencia
        </div>

        <nav class="nav-menu">
            <!-- VISTA PACIENTE: Botón Resultados -->
            <a href="resultados.html" target="contentFrame" class="btn btn-secundario">
                <i class="fa-solid fa-square-poll-vertical"></i> Resultados
            </a>

            <!-- VISTA PACIENTE: Solapa Plan (Objetivos, Metas, Recursos, Tiempos, Plan Gráfico) -->
            <div class="dropdown">
                <button type="button" class="btn" onclick="toggleGlobalPlanDropdown()">
                    <i class="fa-solid fa-map-location-dot"></i> Plan <i class="fa-solid fa-caret-down"></i>
                </button>
                <div id="globalPlanDropdown" class="dropdown-content">
                    <a href="objetivos.html" target="contentFrame"><i class="fa-solid fa-bullseye"></i> Objetivos</a>
                    <a href="metas.html" target="contentFrame"><i class="fa-solid fa-stairs"></i> Metas</a>
                    <a href="recursos.html" target="contentFrame"><i class="fa-solid fa-toolbox"></i> Recursos</a>
                    <a href="tiempos.html" target="contentFrame"><i class="fa-solid fa-clock"></i> Tiempos</a>
                    <a href="plan_esquema.html" target="contentFrame"><i class="fa-solid fa-diagram-project"></i> Plan Gráfico</a>
                </div>
            </div>

            <!-- VISTA ADMINISTRADOR: Botón Habilitación Paciente -->
            <a href="habilitacion.html" target="contentFrame" class="btn btn-admin">
                <i class="fa-solid fa-user-check"></i> Habilitación Paciente
            </a>
        </nav>
    </header>

    <!-- Marco de Contenido Dinámico (Iframed) -->
    <iframe name="contentFrame" src="grafico_integracion.html" class="content-container"></iframe>

    <script>
        // Control de despliegue de la solapa Plan en el encabezado
        function toggleGlobalPlanDropdown() {
            const dropdown = document.getElementById('globalPlanDropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        // Cerrar la solapa al hacer clic fuera de ella
        window.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown')) {
                const dropdown = document.getElementById('globalPlanDropdown');
                if (dropdown) dropdown.style.display = 'none';
            }
        });
    </script>
</body>
</html>
